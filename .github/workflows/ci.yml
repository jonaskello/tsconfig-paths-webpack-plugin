name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
  lint:
    name: Linting Checks
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting Checks
        run: node --run lint

      - name: Run Type Checking
        run: node --run type-check

  test:
    name: "Test - Node: ${{ matrix.node_version }}"
    runs-on: ubuntu-slim

    strategy:
      fail-fast: true
      matrix:
        node_version:
          - "24"
          - "26"

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node_version }}

      - name: Install dependencies
        run: npm ci

      - name: build
        run: yarn build

      - name: test
        run: node --run test-coverage

      - name: Report coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
